<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AEVEMORA · 申请测试次数</title>
<script src="../owner-config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080a0e;color:#eee6da;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(700px 420px at 50% -8%,rgba(199,151,78,.14),transparent 68%),radial-gradient(520px 360px at 8% 92%,rgba(158,112,55,.07),transparent 72%),#080a0e}
.card{position:relative;width:min(94vw,620px);padding:44px 42px 38px;border:1px solid rgba(216,177,108,.23);border-radius:28px;background:linear-gradient(155deg,rgba(255,255,255,.026),rgba(255,255,255,.006)),#0e1014;box-shadow:0 40px 120px rgba(0,0,0,.5)}
.card:before{content:"";position:absolute;inset:14px;border:1px solid rgba(216,177,108,.065);border-radius:20px;pointer-events:none}
.mark{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}.mark i{width:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(215,176,108,.5))}.mark i:last-child{transform:scaleX(-1)}.mark b{width:8px;height:8px;border:1px solid #c89b58;transform:rotate(45deg)}
.eyebrow{text-align:center;color:#b58a50;font:600 10px Georgia,serif;letter-spacing:.24em}.title{text-align:center;margin:14px 0 10px;font:600 38px/1.2 Georgia,"Songti SC",serif}.desc{text-align:center;margin:0 auto;max-width:440px;color:#877e75;font-size:12px;line-height:1.9}
.status{margin:28px 0 22px;padding:17px 18px;border:1px solid rgba(255,255,255,.065);border-radius:15px;background:rgba(255,255,255,.012);display:flex;align-items:center;justify-content:space-between;gap:20px}.status div{display:flex;flex-direction:column;gap:5px}.status b{color:#d6b06f;font:600 10px Georgia,serif;letter-spacing:.14em}.status span{color:#8f857a;font-size:11px}.status em{font-style:normal;color:#7b6e5f;font:600 10px Georgia,serif}
.btn{width:100%;height:58px;border-radius:14px;font-weight:750;cursor:pointer}.primary{border:1px solid #e1bb76;background:linear-gradient(180deg,#e1c17f,#bd8e49);color:#17120c}.ghost{margin-top:11px;border:1px solid rgba(255,255,255,.075);background:rgba(255,255,255,.014);color:#c9bfb2}
.or{display:flex;align-items:center;gap:12px;margin:20px 0;color:#625d57;font:600 8px Georgia,serif;letter-spacing:.16em}.or:before,.or:after{content:"";height:1px;flex:1;background:rgba(255,255,255,.055)}
.note{min-height:22px;margin-top:12px;text-align:center;color:#9a886d;font-size:10px;line-height:1.6}.small{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.05);text-align:center;color:#5f5a55;font-size:9px;line-height:1.8}
@media(max-width:600px){.card{padding:38px 22px 30px}.title{font-size:32px}}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><i></i><b></b><i></i></div>
  <div class="eyebrow">ADDITIONAL ENTRY · REQUEST · V9.8.1</div>
  <h1 class="title">申请新的测试次数</h1>
  <p class="desc">你的首次免费体验已经完成。需要再次测试时，向发布者申请一个新的测试次数即可；收到授权码后返回验证。</p>
  <div class="status"><div><b>FREE ENTRY</b><span>首次完整测试</span></div><em>已使用</em></div>
  <button class="btn primary" onclick="goOwner()">前往发布者账号申请次数</button>
  <div class="or">OR</div>
  <button class="btn ghost" onclick="location.href='../?v=9.8.1&code=1'">我已经拿到授权码</button>
  <div id="note" class="note"></div>
  <div class="small">查看已经生成的上次结果不需要重新申请。</div>
</div>
<script>
function requestText(){
  return "AEVEMORA 测试次数申请\n你好，我的首次免费测试已经完成，想申请一次新的测试次数。";
}
async function goOwner(){
  const cfg=window.AEVEMORA_OWNER_CONFIG||{};
  if(cfg.accountUrl){
    location.href=cfg.accountUrl;
    return;
  }
  const note=document.getElementById("note");
  try{
    await navigator.clipboard.writeText(requestText());
    note.textContent="发布者账号尚未绑定；申请文案已复制。请回到你获得测试链接的账号发送。";
  }catch(e){
    note.textContent="发布者账号尚未绑定。请回到你获得测试链接的账号申请次数。";
  }
}
</script>
</body>
</html>
